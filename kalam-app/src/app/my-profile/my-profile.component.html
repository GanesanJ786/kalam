<!-- ============================================ -->
<!-- KALAM MY PROFILE - Black & Orange Sports Theme -->
<!-- ============================================ -->

<!-- Compact Profile Strip -->
<section class="profile-strip">
  <div class="strip-content">
    <div class="logo-badge">
      <div class="logo-ring">
        <img class="academy-logo" *ngIf="!logo" src="../../assets/logo/kLogo.png" alt="academy logo" />
        <img class="academy-logo" *ngIf="logo" [src]="logo" alt="academy logo" />
      </div>
      <span class="live-dot" *ngIf="allBtnDisabled"></span>
    </div>
    <div class="academy-meta">
      <h2 class="academy-name">{{academyName}}</h2>
      <div class="academy-subtitle">
        <mat-icon class="subtitle-icon">sports_soccer</mat-icon>
        <span>Football Academy</span>
        <span class="meta-divider">|</span>
        <mat-icon class="subtitle-icon">location_on</mat-icon>
        <span>India</span>
      </div>
    </div>
    <!-- <div class="strip-actions-inline">
      <button class="icon-btn-ghost" *ngIf="owner" (click)="viewCoachData()" matTooltip="Coach Details">
        <mat-icon>groups</mat-icon>
      </button>
      <button class="icon-btn-ghost" *ngIf="!owner" (click)="applyLeave()" matTooltip="Apply Leave">
        <mat-icon>event_busy</mat-icon>
      </button>
    </div> -->
  </div>
</section>

<!-- Notification Alerts -->
<section class="alerts-section" *ngIf="notApproved.length > 0 || newStudents.length > 0 || paidStudentList.length > 0">
  <div class="alerts-container">
    <button class="alert-chip" *ngIf="notApproved.length > 0" (click)="approval()">
      <mat-icon>person_add</mat-icon>
      <span class="alert-label">Coach</span>
      <span class="alert-badge">{{notApproved.length}}</span>
    </button>
    <button class="alert-chip" *ngIf="newStudents.length > 0" (click)="studentApproval()">
      <mat-icon>how_to_reg</mat-icon>
      <span class="alert-label">Students</span>
      <span class="alert-badge">{{newStudents.length}}</span>
    </button>
    <button class="alert-chip" *ngIf="paidStudentList.length > 0" (click)="feesApproval()">
      <mat-icon>payments</mat-icon>
      <span class="alert-label">Fees</span>
      <span class="alert-badge">{{paidStudentList.length}}</span>
    </button>
  </div>
</section>

<!-- Quick Actions Bar -->
<section class="actions-section">
  <div class="actions-container" *ngIf="owner">
    <button class="action-btn action-primary" (click)="addGround()">
      <mat-icon>add_location_alt</mat-icon>
      <span>Add Ground</span>
    </button>
    <button class="action-btn action-secondary" (click)="viewCoachData()">
      <mat-icon>groups</mat-icon>
      <span>Coach Details</span>
    </button>
    <button class="action-btn action-attendance" (click)="quickAttendance()">
      <mat-icon>fact_check</mat-icon>
      <span>Quick Attendance</span>
    </button>
  </div>
  <div class="actions-container actions-end" *ngIf="!owner">
    <button class="action-btn action-attendance" (click)="quickAttendance()">
      <mat-icon>fact_check</mat-icon>
      <span>Quick Attendance</span>
    </button>
    <button class="action-btn action-warn" (click)="applyLeave()">
      <mat-icon>event_busy</mat-icon>
      <span>Apply Leave</span>
    </button>
  </div>
</section>

<!-- Grounds Section -->
<section class="grounds-section">
  <div class="section-header">
    <div class="section-title-row">
      <mat-icon class="section-icon">stadium</mat-icon>
      <h3 class="section-title">Training Grounds</h3>
    </div>
    <span class="ground-count">{{groundList.length}} Ground{{groundList.length !== 1 ? 's' : ''}}</span>
  </div>

  <div class="grounds-grid">
    <div *ngFor="let ground of groundList; let i = index" class="ground-card" [class.ground-active]="!ground.disableOutBtn">
      <!-- Active indicator pulse -->
      <div class="active-pulse" *ngIf="!ground.disableOutBtn"></div>

      <div class="ground-card-header">
        <div class="ground-icon-wrap">
          <mat-icon class="ground-icon">sports_soccer</mat-icon>
        </div>
        <div class="ground-info">
          <h4 class="ground-name">{{ground.groundName}}</h4>
          <button class="students-link" *ngIf="allStudents.length > 0" (click)="viewAllStudents(ground.groundName)">
            <mat-icon class="link-icon">people</mat-icon>
            {{ground.totalStudent}} Student{{ground.totalStudent !== 1 ? 's' : ''}}
          </button>
        </div>
      </div>

      <div class="ground-card-actions">
        <button class="ground-btn ground-btn-in"
                [disabled]="ground.disableInBtn || allBtnDisabled"
                (click)="checkIn(ground)">
          <mat-icon>login</mat-icon>
          <span>IN</span>
        </button>
        <button class="ground-btn ground-btn-out"
                [disabled]="ground.disableOutBtn"
                (click)="out(ground)">
          <mat-icon>logout</mat-icon>
          <span>OUT</span>
        </button>
      </div>

      <!-- Status bar at bottom -->
      <div class="ground-status" [class.status-active]="!ground.disableOutBtn">
        <span *ngIf="!ground.disableOutBtn">● Session Active</span>
        <span *ngIf="ground.disableOutBtn">○ No Active Session</span>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-grounds" *ngIf="groundList.length === 0">
    <mat-icon class="empty-icon">location_off</mat-icon>
    <p>No training grounds added yet</p>
    <button class="action-btn action-primary" *ngIf="owner" (click)="addGround()">
      <mat-icon>add_location_alt</mat-icon>
      <span>Add Your First Ground</span>
    </button>
  </div>
</section>
