  <div class="rf-container">
      <app-header [title]="title"></app-header>
        <div class="rf-content content-top" style="padding: 0;">
            <div class="tab-menu-cust">
                <mat-tab-group [selectedIndex]="tabIndex" (selectedTabChange)="tabChanged($event)">
                    <mat-tab>
                       <ng-template mat-tab-label>
                        <span class="k-bottom-tab-label">
                          <mat-icon class="example-tab-icon">home</mat-icon>
                          <span class="k-bottom-tab-text">Home</span>
                        </span>
                      </ng-template>
                      <ng-template matTabContent>
                        <!-- Content 1 - Loaded: {{getTimeLoaded(1) | date:'medium'}} -->
                        <app-my-profile></app-my-profile>
                      </ng-template>
                    </mat-tab>
                    <mat-tab>
                      <ng-template mat-tab-label>
                        <span class="k-bottom-tab-label">
                          <mat-icon>people</mat-icon>
                          <span class="k-bottom-tab-text">Teams</span>
                        </span>
                      </ng-template>
                      
                      <ng-template matTabContent>
                        <!-- Content 2 - Loaded: {{getTimeLoaded(2) | date:'medium'}} -->
                        <app-my-teams></app-my-teams>
                      </ng-template>
                    </mat-tab>
                    <mat-tab *ngIf="owner">
                      <ng-template mat-tab-label>
                        <span class="k-bottom-tab-label">
                          <mat-icon>card_membership</mat-icon>
                          <span class="k-bottom-tab-text">Scholarship</span>
                        </span>
                      </ng-template>
                      <ng-template matTabContent>
                        <app-studentscholarship></app-studentscholarship>
                      </ng-template>
                    </mat-tab>
                    <mat-tab>
                      <ng-template mat-tab-label>
                        <span class="k-bottom-tab-label">
                          <mat-icon>bar_chart</mat-icon>
                          <span class="k-bottom-tab-text">Analysis</span>
                        </span>
                      </ng-template>
                     
                      <ng-template matTabContent>
                        <app-student-analytics></app-student-analytics>
                      </ng-template>
                    </mat-tab>
                  </mat-tab-group>
            </div>
        </div>
        <!-- <div class="rf-footer">
            
        </div> -->
</div>
