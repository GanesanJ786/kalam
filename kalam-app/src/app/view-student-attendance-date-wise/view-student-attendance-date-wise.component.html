<ng-container *ngIf="data.length > 0; else noData">
    <h4 mat-dialog-title>
        <mat-icon class="dialog-title-icon">fact_check</mat-icon>
        Students Attendance
    </h4>
    <h5 class="dialog-subtitle">{{data[0]?.groundName}} — {{data[0]?.loginDate}}</h5>
    <div mat-dialog-content class="dialog-table-content">
        <div class="custom-table">
            <table mat-table [dataSource]="dataSource" matSort class="tableFull">
    
                <ng-container matColumnDef="name">
                    <th style="width: 60%;" mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>
    
                <ng-container matColumnDef="status">
                    <th style="width: 30%;" mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                    <td mat-cell *matCellDef="let row">
                        <span *ngIf="row.status == 'IN'" class="status-badge status-in"><mat-icon class="status-icon">check_circle</mat-icon> IN</span>
                        <span *ngIf="row.status == 'OUT'" class="status-badge status-out"><mat-icon class="status-icon">cancel</mat-icon> OUT</span>
                    </td>
                </ng-container>
    
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</ng-container>
<ng-template #noData>
    <div class="empty-state-dialog">
        <mat-icon class="empty-icon">search_off</mat-icon>
        <p>Students Attendance Not Found.</p>
    </div>
</ng-template>

<div mat-dialog-actions>
    <button mat-button (click)="cancel()">Close</button>
</div>
