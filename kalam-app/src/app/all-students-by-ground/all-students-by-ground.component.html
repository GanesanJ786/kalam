<ng-container>
    <ng-container> 
            <div mat-dialog-content class="dialog-fullscreen-content">
                <div class="rf-header custm-logo">
                    <button (click)="cancel()" class="backNav"><mat-icon>keyboard_arrow_left</mat-icon></button>
                    <div class="header-title">{{title}} {{groundName}}</div>
                </div>
                <div class="s-list">
                      <div class="custom-table">
                        <table mat-table [dataSource]="dataSource" matSort class="tableFull">
                      
                          <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                            <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                          </ng-container>
                      
                          <ng-container matColumnDef="institutionName">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Institution </th>
                            <td mat-cell *matCellDef="let row"> {{row.institutionName}} </td>
                          </ng-container>
                      
                          <ng-container matColumnDef="mobileNum">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Contact </th>
                            <td mat-cell *matCellDef="let row"> <a (click)="$event.stopPropagation()" [href]="callNum(row.mobileNum)">{{row.mobileNum}}</a> </td>
                          </ng-container>
            
                          <ng-container matColumnDef="payment">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header> Payment </th>
                              <td mat-cell *matCellDef="let row"> 
                                  <span *ngIf="row.payment == 'Not Paid'"><mat-icon class="clear icon-cus-class">clear</mat-icon></span>
                                  <span *ngIf="row.payment == 'Paid'"><mat-icon class="done icon-cus-class">done</mat-icon></span> 
                                  <span class="free icon-cus-class" *ngIf="row.payment == 'Free'">{{row.payment}}</span>    
                              </td>
                          </ng-container>
                      
                          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                          <tr mat-row (click)="viewStudent(row)" *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table>
                      </div>
                </div>
            </div>
    </ng-container>
</ng-container>
